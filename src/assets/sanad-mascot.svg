<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="شاب يحمل سيرته الذاتية ويلوّح بيده">
  <style>
    .float{animation:float 3.4s ease-in-out infinite}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.4s ease-in-out infinite}
    .wave{transform-origin:176px 124px;animation:wave 6s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
    .cv{transform-origin:52px 190px;animation:cv 3.4s ease-in-out infinite}
    .tw1{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
    .tw2{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out 1.1s infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.7}}
    @keyframes wave{0%,34%,100%{transform:rotate(0)}6%{transform:rotate(-20deg)}12%{transform:rotate(9deg)}18%{transform:rotate(-18deg)}24%{transform:rotate(7deg)}30%{transform:rotate(-9deg)}}
    @keyframes cv{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes twinkle{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.15);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <defs>
    <linearGradient id="gHood" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="#7AF0DC"/><stop offset=".55" stop-color="#3ADBC0"/><stop offset="1" stop-color="#22A992"/></linearGradient>
    <linearGradient id="gPants" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34309A"/><stop offset="1" stop-color="#100C46"/></linearGradient>
    <linearGradient id="gShoe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#CFD2EA"/></linearGradient>
    <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DDE0F2"/></linearGradient>
    <linearGradient id="gHair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B35B0"/><stop offset=".5" stop-color="#1A1464"/><stop offset="1" stop-color="#0D0A38"/></linearGradient>
    <radialGradient id="gSkin" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#FFE0C2"/><stop offset=".55" stop-color="#F3C29B"/><stop offset="1" stop-color="#D99A70"/></radialGradient>
    <radialGradient id="gHand" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFE0C2"/><stop offset="1" stop-color="#DDA076"/></radialGradient>
    <linearGradient id="gSleeveShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".15"/></linearGradient>
    <filter id="fSoft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1A1464" flood-opacity=".28"/></filter>
    <filter id="fBlur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse class="shadow" cx="130" cy="290" rx="58" ry="7" fill="#1A1464" opacity=".13"/>
  <path class="tw1" d="M30 78l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#3ADBC0"/>
  <path class="tw2" d="M232 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#1A1464"/>

  <g class="float" filter="url(#fSoft)">
    <!-- legs + sneakers -->
    <rect x="102" y="204" width="24" height="60" rx="9" fill="url(#gPants)" stroke="#1A1464" stroke-width="4" stroke-linejoin="round"/>
    <rect x="134" y="204" width="24" height="60" rx="9" fill="#1A1464" stroke="#1A1464" stroke-width="4" stroke-linejoin="round"/>
    <path d="M94 270Q94 258 108 258H126Q130 270 126 274H98Q94 274 94 270Z" fill="url(#gShoe)" stroke="#1A1464" stroke-width="4" stroke-linejoin="round"/>
    <path d="M166 270Q166 258 152 258H134Q130 270 134 274H162Q166 274 166 270Z" fill="url(#gShoe)" stroke="#1A1464" stroke-width="4" stroke-linejoin="round"/>
    <path d="M96 273H126M134 273H164" stroke="#1A1464" stroke-width="5" stroke-linecap="round"/>
    <path d="M98 268H124M136 268H162" stroke="#3ADBC0" stroke-width="3" stroke-linecap="round"/>

    <!-- hoodie body -->
    <path d="M86 126Q86 108 104 106H156Q174 108 174 126V204Q174 214 164 214H96Q86 214 86 204Z" fill="url(#gHood)" stroke="#1A1464" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M112 106Q130 124 148 106" fill="#D5F7F0" stroke="#1A1464" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M122 120V132M138 120V132" stroke="#1A1464" stroke-width="3" stroke-linecap="round"/>
    <path d="M104 172H156Q156 190 130 190Q104 190 104 172Z" fill="#2fc0a8" stroke="#1A1464" stroke-width="3.5" stroke-linejoin="round" opacity=".9"/>

    <path d="M150 108H156Q174 110 174 126V204Q174 214 164 214H140Q154 200 152 170Z" fill="#0b5f52" opacity=".28"/>
    <path d="M92 124Q94 112 108 110" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="130" cy="216" rx="40" ry="6" fill="#0d0a38" opacity=".28" filter="url(#fBlur)"/>
    <!-- "سندي" printed on the hoodie (outlined path, no font needed) -->
    <path transform="translate(106.0 154) scale(0.017)" d="M355 248Q288 248 230.5 229.0Q173 210 130.5 176.0Q88 142 64.0 96.5Q40 51 40 -2Q40 -21 43.0 -50.0Q46 -79 51.0 -117.0Q56 -155 63 -199L214 -179Q204 -117 198.5 -70.5Q193 -24 193 -4Q193 31 213.0 58.5Q233 86 269.5 101.5Q306 117 355 117H638Q700 117 729.0 87.5Q758 58 758 -1Q758 -32 748.0 -49.0Q738 -66 711.0 -78.5Q684 -91 633 -106Q569 -127 523.0 -145.0Q477 -163 447.5 -184.0Q418 -205 404.0 -234.0Q390 -263 390 -305Q390 -372 420.5 -415.5Q451 -459 507.0 -481.0Q563 -503 638 -503Q674 -503 721.5 -498.0Q769 -493 847 -483L830 -355Q756 -363 710.5 -367.5Q665 -372 634 -372Q600 -372 580.0 -365.5Q560 -359 551.5 -346.0Q543 -333 543 -313Q543 -296 554.0 -284.0Q565 -272 584.5 -263.0Q604 -254 628.0 -247.0Q652 -240 679 -231Q737 -214 780.0 -193.5Q823 -173 852.0 -146.5Q881 -120 896.0 -84.5Q911 -49 911 -1Q911 72 877.0 128.0Q843 184 782.0 216.0Q721 248 638 248ZM305 472V350H451V472ZM502 472V350H648V472Z M1008 0V-131H1268V-196Q1268 -265 1254.0 -303.0Q1240 -341 1208.0 -356.5Q1176 -372 1120 -372H1039V-503H1120Q1217 -503 1284.0 -471.0Q1351 -439 1386.0 -371.5Q1421 -304 1421 -196V-131H1525Q1531 -131 1534.5 -126.5Q1538 -122 1540.5 -113.5Q1543 -105 1544.0 -93.0Q1545 -81 1545.0 -66.0Q1545 -51 1544.0 -38.5Q1543 -26 1540.5 -17.5Q1538 -9 1534.5 -4.5Q1531 0 1525 0Z M1525 0Q1519 0 1515.5 -4.5Q1512 -9 1510.0 -17.5Q1508 -26 1506.5 -38.5Q1505 -51 1505 -66Q1505 -86 1507.0 -100.5Q1509 -115 1513.5 -123.0Q1518 -131 1525 -131H1629V-503H1782V-131H1887Q1892 -131 1896.0 -126.5Q1900 -122 1902.0 -113.5Q1904 -105 1905.5 -93.0Q1907 -81 1907.0 -66.0Q1907 -51 1905.5 -38.5Q1904 -26 1902.0 -17.5Q1900 -9 1896.0 -4.5Q1892 0 1887 0ZM1629 -596V-718H1783V-596Z M2496 0Q2452 0 2410 -17Q2388 -25 2368 -37Q2361 -32 2354 -28Q2303 0 2224 0H1887Q1882 0 1878.0 -4.5Q1874 -9 1872.0 -17.5Q1870 -26 1868.5 -38.5Q1867 -51 1867 -66Q1867 -86 1869.0 -100.5Q1871 -115 1875.5 -123.0Q1880 -131 1887 -131H2000V-400H2153V-131H2224Q2255 -131 2271.5 -140.5Q2288 -150 2294.5 -179.5Q2301 -209 2301 -269V-450H2454V-269Q2454 -200 2440 -149Q2450 -143 2460 -139Q2478 -131 2496 -131H2604V-274Q2604 -289 2600.5 -321.5Q2597 -354 2590.5 -395.5Q2584 -437 2576 -480L2726 -503Q2733 -467 2740.0 -422.0Q2747 -377 2752.0 -337.0Q2757 -297 2757 -274V0Z" fill="#fff" stroke="#1A1464" stroke-width="85" stroke-linejoin="round" paint-order="stroke"/>
    <!-- head -->
    <rect x="120" y="92" width="20" height="18" rx="6" fill="#D99A70" stroke="#1A1464" stroke-width="4"/>
    <circle cx="94" cy="68" r="7" fill="url(#gHand)" stroke="#1A1464" stroke-width="4"/>
    <circle cx="166" cy="68" r="7" fill="url(#gHand)" stroke="#1A1464" stroke-width="4"/>
    <circle cx="130" cy="64" r="36" fill="url(#gSkin)" stroke="#1A1464" stroke-width="4.5"/>
    <!-- hair -->
    <path d="M94 62Q90 24 128 24Q142 14 160 26Q172 38 166 62Q160 46 146 44Q124 52 106 44Q98 48 94 62Z" fill="url(#gHair)" stroke="#1A1464" stroke-width="4" stroke-linejoin="round"/>
    <path d="M108 36Q126 28 144 32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="130" cy="50" rx="30" ry="7" fill="#7a4a2a" opacity=".22" filter="url(#fBlur)"/>
    <path d="M150 90Q160 80 164 66Q166 82 154 96Z" fill="#b97a52" opacity=".28"/>
    <!-- face -->
    <g class="eye"><ellipse cx="117" cy="70" rx="4.5" ry="6" fill="#1A1464"/><circle cx="118.6" cy="67.6" r="1.7" fill="#fff"/></g>
    <g class="eye"><ellipse cx="143" cy="70" rx="4.5" ry="6" fill="#1A1464"/><circle cx="144.6" cy="67.6" r="1.7" fill="#fff"/></g>
    <path d="M110 57Q117 53 124 56M136 56Q143 53 150 57" fill="none" stroke="#1A1464" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 74Q131 79 127 80" fill="none" stroke="#c4875c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="104" cy="82" r="6" fill="#ff8f7a" opacity=".35"/><circle cx="156" cy="82" r="6" fill="#ff8f7a" opacity=".35"/>
    <path d="M118 84Q130 97 142 84" fill="#fff" stroke="#1A1464" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- left arm holding the CV -->
    <g class="cv">
      <path d="M90 124Q64 138 60 168" fill="none" stroke="#1A1464" stroke-width="19" stroke-linecap="round"/>
      <path d="M90 124Q64 138 60 168" fill="none" stroke="#3ADBC0" stroke-width="10.5" stroke-linecap="round"/>
      <path d="M88 119Q64 132 58 160" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
      <g transform="rotate(-6 52 196)">
        <rect x="28" y="162" width="56" height="74" rx="6" fill="#B9BDDC" stroke="#1A1464" stroke-width="4"/>
        <rect x="24" y="158" width="56" height="74" rx="6" fill="url(#gPaper)" stroke="#1A1464" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M64 158V172Q64 176 68 176H80Z" fill="#D5F7F0" stroke="#1A1464" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="30" y="181" width="34" height="17" rx="5" fill="#3ADBC0" stroke="#1A1464" stroke-width="2.5"/>
        <path transform="translate(39.9 193.9) scale(0.0125)" d="M308 12Q228 12 175.5 -8.0Q123 -28 92.5 -70.5Q62 -113 49.5 -179.5Q37 -246 37 -340Q37 -434 49.5 -501.0Q62 -568 92.5 -610.0Q123 -652 176.5 -672.0Q230 -692 313 -692Q345 -692 381.0 -688.5Q417 -685 451.5 -679.0Q486 -673 511 -667L507 -543Q487 -546 458.0 -549.0Q429 -552 398.5 -554.5Q368 -557 341 -557Q296 -557 268.0 -546.0Q240 -535 224.5 -509.5Q209 -484 203.5 -443.0Q198 -402 198 -340Q198 -279 203.5 -237.5Q209 -196 224.5 -171.0Q240 -146 268.0 -135.0Q296 -124 342 -124Q382 -124 429.5 -128.0Q477 -132 508 -135L511 -12Q488 -7 454.5 -1.0Q421 5 382.5 8.5Q344 12 308 12Z M704 0 546 -680H713L816 -155H852L952 -680H1119L965 0Z" fill="#1A1464"/>
        <rect x="32" y="205" width="40" height="4" rx="2" fill="#3ADBC0"/>
        <rect x="32" y="214" width="40" height="4" rx="2" fill="#D5D7EA"/>
        <rect x="32" y="223" width="28" height="4" rx="2" fill="#D5D7EA"/>
      </g>
      <circle cx="60" cy="168" r="8" fill="url(#gHand)" stroke="#1A1464" stroke-width="4"/>
    </g>

    <!-- waving arm -->
    <g class="wave">
      <path d="M170 124Q200 120 210 90" fill="none" stroke="#1A1464" stroke-width="19" stroke-linecap="round"/>
      <path d="M170 124Q200 120 210 90" fill="none" stroke="#3ADBC0" stroke-width="10.5" stroke-linecap="round"/>
      <path d="M172 119Q198 115 206 92" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="211" cy="82" r="9" fill="url(#gHand)" stroke="#1A1464" stroke-width="4"/>
    </g>
  </g>
</svg>
