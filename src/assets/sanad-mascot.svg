<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="شخصية ورقة السيرة الذاتية بقبعة تخرج تلوّح بيدها">
  <style>
    .float{animation:float 3.4s ease-in-out infinite}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.4s ease-in-out infinite}
    .wave{transform-origin:196px 148px;animation:wave 6s ease-in-out infinite}
    .sway{transform-origin:80px 58px;animation:sway 3.4s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
    .tw1{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
    .tw2{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out 1.1s infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.7}}
    @keyframes wave{0%,34%,100%{transform:rotate(0)}6%{transform:rotate(-22deg)}12%{transform:rotate(10deg)}18%{transform:rotate(-20deg)}24%{transform:rotate(8deg)}30%{transform:rotate(-10deg)}}
    @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes twinkle{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.15);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- soft shadow on the floor -->
  <ellipse class="shadow" cx="131" cy="288" rx="56" ry="7" fill="#1A1464" opacity=".13"/>

  <!-- sparkles -->
  <path class="tw1" d="M34 78l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#3ADBC0"/>
  <path class="tw2" d="M236 52l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#1A1464"/>

  <g class="float">
    <!-- legs and shoes -->
    <rect x="99" y="236" width="11" height="28" rx="5.5" fill="#1A1464"/>
    <rect x="152" y="236" width="11" height="28" rx="5.5" fill="#1A1464"/>
    <ellipse cx="102" cy="268" rx="14" ry="7" fill="#1A1464"/>
    <ellipse cx="161" cy="268" rx="14" ry="7" fill="#1A1464"/>

    <!-- resting arm (left) -->
    <path d="M67 152Q50 160 46 184" fill="none" stroke="#1A1464" stroke-width="6" stroke-linecap="round"/>
    <circle cx="45" cy="188" r="8" fill="#fff" stroke="#1A1464" stroke-width="4"/>

    <!-- the paper -->
    <path d="M67 86Q67 76 77 76H166L196 106V230Q196 242 184 242H79Q67 242 67 230Z" fill="#fff" stroke="#1A1464" stroke-width="5" stroke-linejoin="round"/>
    <!-- folded corner -->
    <path d="M166 76V100Q166 106 172 106H196Z" fill="#D5F7F0" stroke="#1A1464" stroke-width="5" stroke-linejoin="round"/>

    <!-- face -->
    <g class="eye"><ellipse cx="112" cy="130" rx="7" ry="9" fill="#1A1464"/><circle cx="114.5" cy="126" r="2.6" fill="#fff"/></g>
    <g class="eye"><ellipse cx="150" cy="130" rx="7" ry="9" fill="#1A1464"/><circle cx="152.5" cy="126" r="2.6" fill="#fff"/></g>
    <circle cx="97" cy="148" r="7.5" fill="#3ADBC0" opacity=".38"/>
    <circle cx="165" cy="148" r="7.5" fill="#3ADBC0" opacity=".38"/>
    <path d="M119 148Q131 161 143 148" fill="none" stroke="#1A1464" stroke-width="4" stroke-linecap="round"/>

    <!-- CV lines -->
    <rect x="88" y="178" width="86" height="8" rx="4" fill="#3ADBC0"/>
    <rect x="88" y="194" width="86" height="6" rx="3" fill="#D5D7EA"/>
    <rect x="88" y="207" width="64" height="6" rx="3" fill="#D5D7EA"/>
    <rect x="88" y="220" width="76" height="6" rx="3" fill="#D5D7EA"/>

    <!-- graduation cap -->
    <path d="M97 58V78Q131 94 165 78V58L131 70Z" fill="#2B2590" stroke="#1A1464" stroke-width="3" stroke-linejoin="round"/>
    <path d="M131 30L198 53L131 76L64 53Z" fill="#1A1464" stroke="#1A1464" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="131" cy="53" r="4.5" fill="#3ADBC0"/>
    <g class="sway">
      <path d="M131 53L80 58V84" fill="none" stroke="#3ADBC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M75 84H85L87 97H73Z" fill="#3ADBC0" stroke="#1A1464" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- waving arm (right) -->
    <g class="wave">
      <path d="M196 150Q218 148 226 122" fill="none" stroke="#1A1464" stroke-width="6" stroke-linecap="round"/>
      <circle cx="227" cy="116" r="8.5" fill="#fff" stroke="#1A1464" stroke-width="4"/>
    </g>
  </g>
</svg>
